services:
  # As imagens são construídas pelo GitHub Actions com uma tag sha-* e o
  # workflow aciona os três deploys pelo Render API. O :latest serve apenas
  # para a criação inicial das instâncias.
  - type: web
    name: climagrid-frontend
    runtime: image
    plan: free
    image:
      url: docker.io/victorszcruzpoli/climagrid-frontend:latest
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "3000"
      - key: HOSTNAME
        value: 0.0.0.0

  - type: web
    name: climagrid-backend
    runtime: image
    plan: free
    image:
      url: docker.io/victorszcruzpoli/climagrid-backend:latest
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "3333"
      - key: NODE_ENV
        value: production
      # URL pública do AI service no plano gratuito do Render.
      - key: AI_SERVICE_URL
        sync: false
      # Origem pública exata do frontend, sem barra final.
      - key: FRONTEND_ORIGIN
        sync: false
      - key: PWF_STORAGE_ROOT
        value: /app/data/pwf
      - key: SCENARIO_STORAGE_ROOT
        value: /app/data/scenarios
      - key: SUPABASE_URL
        sync: false
      # Use a service_role key somente neste backend; nunca no frontend.
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: pwf

  # Web service público porque Private Services não existem no plano Free.
  - type: web
    name: climagrid-ai-service
    runtime: image
    plan: free
    image:
      url: docker.io/victorszcruzpoli/climagrid-ai-service:latest
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: CDSAPI_URL
        value: https://cds.climate.copernicus.eu/api
      - key: CDSAPI_KEY
        sync: false
      - key: CLIMAGRID_DATA_ROOT
        value: /service/data
      - key: CLIMAGRID_HISTORICAL_SNAPSHOT
        value: /service/data/processed/historical/observations.parquet
      - key: CLIMAGRID_PLANT_CATALOG
        value: /service/data/processed/reference/plant_locations.parquet
      - key: CLIMAGRID_PWF_MAPPING
        value: /service/data/processed/reference/pwf_bus_mapping.parquet
      - key: CLIMAGRID_ARTIFACT_DIR
        value: /service/artifacts/global/v1
